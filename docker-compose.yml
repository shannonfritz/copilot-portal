# Copilot Portal — container deployment (experimental).
#
# Quick start:
#   1. Put a GitHub token (with Copilot access) in a .env file next to this:
#        echo "GITHUB_TOKEN=ghp_xxx" > .env
#   2. Build + run:
#        docker compose up -d --build
#   3. Open http://<host>:3847  (the token to log in is printed in the logs:
#        docker compose logs -f copilot-portal)
#
# See docs/DOCKER.md for the full guide (TrueNAS SCALE, private image transfer,
# updates, and caveats).

services:
  copilot-portal:
    build: .
    image: copilot-portal:dev
    container_name: copilot-portal
    # Run an init (tini) as PID 1 so signals are forwarded and zombie
    # subprocesses (e.g. the CLI server) are reaped on shutdown.
    init: true
    # The image runs as the non-root user baked in at build time (default
    # 568:568 — TrueNAS's "apps" user). To run as a different host user without
    # rebuilding, uncomment and set this (must be able to write the volumes):
    #   user: "1000:1000"
    ports:
      - "3847:3847"
    environment:
      # Simplest auth path: a GitHub token with Copilot access.
      # Leave empty if you instead rely on a mounted, pre-authenticated ~/.copilot.
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
      # Container-mode flags (also set in the image; repeated here for clarity).
      COPILOT_CONTAINER: "1"
      COPILOT_AUTO_UPDATE: "0"
      # Local timezone for log + workspace-folder (YYMMDD-NN) timestamps.
      TZ: "${TZ:-UTC}"
      # Where new sessions auto-create their per-session work/YYMMDD-NN folders.
      # Points at the persistent /work volume below so workspaces survive rebuilds.
      PORTAL_WORKSPACE_DIR: "/work"
      # umask for files the container writes into /work. 002 makes new files
      # group-writable (664/775) so an SMB read-write group can edit/delete them.
      # Pair this with a setgid, group-owned /work dataset on the NAS.
      UMASK: "002"
    volumes:
      # The important one: auth, sessions, skills, agents, and MCP config all
      # live under ~/.copilot. Persisting it survives restarts AND image rebuilds.
      - copilot-config:/home/copilot/.copilot
      # Portal-side state: access token, tunnel config, debug logs.
      - portal-data:/app/data
      # Per-session workspaces. A named volume persists across rebuilds out of the
      # box. For LAN file access (e.g. an SMB share), replace this line with a bind
      # mount to a NAS dataset instead, e.g.:
      #   - /mnt/tank/apps/copilot-work:/work
      - work-data:/work
    restart: unless-stopped

volumes:
  copilot-config:
  portal-data:
  work-data:
